<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login · RGS CENTER</title>
    <style>
        html.page-loading::before {
            content: "";
            position: fixed;
            inset: 0;
            background: white;
            z-index: 2147483647;
        }
    </style>

    <script>
        document.documentElement.classList.add("page-loading");
    </script>
<link rel="stylesheet" href="styles.css">
</head>
<body data-page="login">
<main class="login-shell">
<section class="login-card" aria-labelledby="loginTitle">
<img class="login-logo" src="../Common/assets/logo.svg" alt="Baltic Scientific Instruments">
<h1 id="loginTitle">RGS CENTER</h1>
<p class="login-subtitle">Robotic Gamma-Ray Spectrometer<br>Control Web Interface v.12</p>
<form id="loginForm">
<h2>Sign in</h2>
<label for="login">Login</label>
<input id="login" name="login" type="text" autocomplete="username" required>
<label for="password">Password</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<p id="loginMessage" role="status" aria-live="polite" hidden></p>
<button type="submit">Sign in</button>
</form>
</section>
</main>
<script src="page.js"></script>
<script src="../Common/init.js"></script>
</body>
</html>
