spring.application.name=center
logging.file.name=logs/rgscenter.log
# Set DEBUG temporarily when detailed device/COM diagnostics are required.
logging.level.com.rgs.center=INFO

# Load the repository .env both when the application starts from the repository
# root and when it starts from the center module (for example, from an IDE).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

# PostgreSQL connection values come from the imported .env or process environment.
spring.datasource.url=jdbc:postgresql://${RGSCENTER_POSTGRES_DB_HOST}:${RGSCENTER_POSTGRES_DB_PORT}/${RGSCENTER_DBNAME}
spring.datasource.username=${RGSCENTER_DEDICATED_APP_USER_NAME}
spring.datasource.password=${RGSCENTER_DEDICATED_APP_USER_PASSWORD}
# The deployed PostgreSQL schema is managed externally by dbscripts.
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.datasource.hikari.maximum-pool-size=5
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Browser-token lifetime and the interval in which a session is considered connected.
rgs.auth.session-duration=8h
rgs.auth.active-window=90s
rgs.auth.cookie-secure=${RGSCENTER_COOKIE_SECURE:false}

# Exclusive-access lease lifetime in PostgreSQL local time.
TTL_MINUTES=5
rgs.only-one.enforce=true

rgs.device.camera.ip=192.168.1.13
rgs.device.camera.enabled=true
rgs.camera.capture-mode=test
rgs.camera.capture-file=C:/camera/bottles.bmp
rgs.camera.output-directory=C:/camera
rgs.camera.capture-executable=C:/SimpleGrab/SimpleGrab.exe
rgs.camera.capture-timeout-millis=10000
rgs.camera.detection.initial-threshold=40
rgs.camera.detection.blur-radius=5
rgs.camera.detection.sauvola-radius=20
rgs.camera.detection.sauvola-k=0.005
rgs.camera.detection.morphology-radius=2
rgs.camera.detection.contour-points-min=40
rgs.camera.detection.diameter-min=20
rgs.camera.detection.diameter-max=180
rgs.camera.detection.aspect-ratio-min=0.78
rgs.camera.detection.aspect-ratio-max=1.22
rgs.camera.detection.circularity-min=0.55
rgs.camera.detection.concentric-center-distance-ratio-max=0.18
rgs.camera.detection.inner-to-outer-ratio-min=0.30
rgs.camera.detection.inner-to-outer-ratio-max=0.90
rgs.camera.detection.duplicate-center-distance-ratio-max=0.35
rgs.device.boson.ip=192.168.1.14
rgs.device.boson.enabled=true
rgs.device.boson.mca-name=BOSON
rgs.device.boson.channel-name=Ch1
rgs.device.boson.status-stale-millis=30000
rgs.device.nicole.ip=127.0.0.1
rgs.device.nicole.port=5000
rgs.device.nicole.enabled=true
rgs.device.nicole.connect-timeout-millis=2000
rgs.device.nicole.read-timeout-millis=250
rgs.device.nicole.response-timeout-millis=3000
rgs.device.lenovo-pc.ip=192.168.201.20
rgs.device.lenovo-pc.enabled=true

# Dobot CCBOX: Dashboard commands and configurable 1 s feedback on port 30006.
rgs.device.manipulator.host=192.168.5.1
rgs.device.manipulator.enabled=true
# Receive telemetry without Dashboard; default preserves the real-robot mode.
rgs.device.manipulator.feedback-only=false
rgs.device.manipulator.command-port=29999
rgs.device.manipulator.feedback-port=30006
rgs.device.manipulator.connect-timeout-millis=2000
rgs.device.manipulator.read-timeout-millis=250
rgs.device.manipulator.response-timeout-millis=3000
rgs.device.manipulator.telemetry-stale-millis=3500
# Bit positions are zero-based in the feedback DigitalInputs mask.
rgs.device.manipulator.hatch-closed-di-bit=0
rgs.device.manipulator.hatch-open-di-bit=1
# Standard 1440-byte feedback has no analogue inputs. Enable the low-priority
# AI(index) Dashboard query only after the physical input has been confirmed.
rgs.device.manipulator.hatch-ai-enabled=false
rgs.device.manipulator.hatch-ai-index=1
rgs.device.manipulator.hatch-ai-poll-interval-millis=2000
rgs.device.manipulator.hatch-ai-poll-initial-delay-millis=4000
rgs.device.manipulator.watchdog-interval-millis=1000
rgs.device.manipulator.watchdog-initial-delay-millis=1000

rgs.device.camera.poll-interval-millis=10000
rgs.device.lenovo-pc.poll-interval-millis=10000
rgs.device.lenovo-pc.poll-initial-delay-millis=0
rgs.device.nicole.poll-interval-millis=10000
rgs.device.boson.poll-interval-millis=10000

# Barcode scanner connected to a physical RS-232 COM port.
rgs.device.barcode-scanner.port=COM7
rgs.device.barcode-scanner.enabled=true
rgs.device.barcode-scanner.baud-rate=9600
rgs.device.barcode-scanner.read-timeout-millis=250
rgs.device.barcode-scanner.scan-attempt-timeout-millis=5000
rgs.device.barcode-scanner.max-code-length=4096
rgs.device.barcode-scanner.response-timeout-millis=1000
rgs.device.barcode-scanner.max-scan-attempts=2
rgs.device.barcode-scanner.retry-delay-millis=250
rgs.device.barcode-scanner.data-suffix=AUTO
rgs.device.barcode-scanner.status-interval-millis=10000
rgs.device.barcode-scanner.status-initial-delay-millis=0

# Gamma Dose Rate Meter connected through the USB-RS virtual COM port.
rgs.device.gdrm.port=COM3
rgs.device.gdrm.enabled=true
rgs.device.gdrm.initial-baud-rate=9600
rgs.device.gdrm.read-timeout-millis=250
rgs.device.gdrm.response-timeout-millis=1200
rgs.device.gdrm.poll-interval-millis=1000
rgs.device.gdrm.poll-initial-delay-millis=1000

# SHP detector signal preamplifier, USB virtual COM (HPGe.Center uses COM5).
rgs.device.shp.port=COM5
rgs.device.shp.enabled=true
rgs.device.shp.baud-rate=9600
rgs.device.shp.read-timeout-millis=250
rgs.device.shp.response-timeout-millis=1200
rgs.device.shp.ready.max-charge-output-voltage=105
rgs.device.shp.ready.max-leakage-current=50
rgs.device.shp.poll-interval-millis=2000
rgs.device.shp.poll-initial-delay-millis=2000

# Gamma-PRO Scenarium TCP server (manual chapter 17, default port from figure 73.2).
rgs.device.gamma-pro.host=127.0.0.1
rgs.device.gamma-pro.enabled=true
rgs.device.gamma-pro.port=37569
rgs.device.gamma-pro.connect-timeout-millis=2000
rgs.device.gamma-pro.read-timeout-millis=250
rgs.device.gamma-pro.response-timeout-millis=3000
rgs.device.gamma-pro.charset=windows-1251
rgs.device.gamma-pro.poll-interval-millis=10000
rgs.device.gamma-pro.poll-initial-delay-millis=0

# Measurement scenario emulator. It never sends commands to physical devices.
rgs.measurement-emulator.tick-millis=1000
rgs.measurement-emulator.initial-delay-millis=1000

# RADWAG WTC scales connected over USB type B virtual COM.
rgs.device.scales.port=COM7
rgs.device.scales.enabled=true
rgs.device.scales.baud-rate=9600
rgs.device.scales.read-timeout-millis=250
rgs.device.scales.response-timeout-millis=700
rgs.device.scales.poll-interval-millis=1000
rgs.device.scales.poll-initial-delay-millis=1000
