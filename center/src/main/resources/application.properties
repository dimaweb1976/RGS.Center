spring.application.name=center
logging.file.name=logs/rgscenter.log
# Set DEBUG temporarily when detailed device/COM diagnostics are required.
logging.level.com.rgs.center=INFO

rgs.device.camera.ip=192.168.1.13
rgs.device.boson.ip=192.168.1.14
rgs.device.nicole.ip=192.168.1.15
rgs.device.roboplc.ip=192.168.1.16

rgs.device.camera.poll-interval-millis=10000
rgs.device.roboplc.poll-interval-millis=10000
rgs.device.nicole.poll-interval-millis=10000
rgs.device.boson.poll-interval-millis=10000

# USB barcode scanner configured as a virtual COM port.
rgs.device.barcode-scanner.port=COM7
rgs.device.barcode-scanner.baud-rate=9600
rgs.device.barcode-scanner.read-timeout-millis=5000
rgs.device.barcode-scanner.max-code-length=4096

# Gamma Dose Rate Meter connected through the USB-RS virtual COM port.
rgs.device.gdrm.port=COM3
rgs.device.gdrm.initial-baud-rate=9600
rgs.device.gdrm.read-timeout-millis=250
rgs.device.gdrm.response-timeout-millis=1200
rgs.device.gdrm.poll-interval-millis=1000
rgs.device.gdrm.poll-initial-delay-millis=1000

# SHP detector signal preamplifier, USB virtual COM (HPGe.Center uses COM5).
rgs.device.shp.port=COM5
rgs.device.shp.baud-rate=9600
rgs.device.shp.read-timeout-millis=250
rgs.device.shp.response-timeout-millis=1200
rgs.device.shp.poll-interval-millis=2000
rgs.device.shp.poll-initial-delay-millis=2000

# Gamma-PRO Scenarium TCP server (manual chapter 17, default port from figure 73.2).
rgs.device.gamma-pro.host=127.0.0.1
rgs.device.gamma-pro.port=37569
rgs.device.gamma-pro.connect-timeout-millis=2000
rgs.device.gamma-pro.read-timeout-millis=250
rgs.device.gamma-pro.response-timeout-millis=3000
rgs.device.gamma-pro.charset=windows-1251
rgs.device.gamma-pro.poll-interval-millis=10000
rgs.device.gamma-pro.poll-initial-delay-millis=0

# Reserved COM port from the target equipment scheme.
rgs.device.scales.port=
