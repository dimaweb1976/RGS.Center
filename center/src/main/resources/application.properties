spring.application.name=center
logging.file.name=logs/rgscenter.log
# Set DEBUG temporarily when detailed device/COM diagnostics are required.
logging.level.com.rgs.center=INFO

rgs.device.camera.ip=192.168.1.13
rgs.device.boson.ip=192.168.1.14
rgs.device.nicole.ip=192.168.1.15
rgs.device.roboplc.ip=192.168.1.16

rgs.device.camera.poll-interval-millis=10000
rgs.device.roboplc.poll-interval-millis=10000
rgs.device.nicole.poll-interval-millis=10000
rgs.device.boson.poll-interval-millis=10000

# USB barcode scanner configured as a virtual COM port.
rgs.device.barcode-scanner.port=COM7
rgs.device.barcode-scanner.baud-rate=9600
rgs.device.barcode-scanner.read-timeout-millis=5000
rgs.device.barcode-scanner.max-code-length=4096

# Reserved COM ports from the target equipment scheme.
rgs.device.scales.port=
rgs.device.shp.port=
