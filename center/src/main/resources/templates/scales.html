<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RGSCenter — Весы</title>
    <style>
        :root { color-scheme: light; font-family: Arial, sans-serif; color: #17202a; background: #f4f6f8; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        header { padding: 18px 28px; color: white; background: #293744; }
        header h1 { margin: 0; font-size: 24px; }
        header p { margin: 5px 0 0; color: #cbd5df; }
        main { max-width: 1180px; margin: 24px auto; padding: 0 20px 32px; }
        .refresh-note { margin: 0 0 12px; color: #687582; font-size: 13px; }
        .loading { opacity: .72; }
    </style>
    <script>
        let scalesStatusLoading = false;

        async function loadScalesStatus() {
            if (scalesStatusLoading) {
                return;
            }
            scalesStatusLoading = true;
            const panel = document.getElementById("scales-status");
            panel.classList.add("loading");
            try {
                const response = await fetch("/scales/status", {cache: "no-store"});
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                panel.innerHTML = await response.text();
            } catch (error) {
                console.error("Failed to update scales status", error);
            } finally {
                panel.classList.remove("loading");
                scalesStatusLoading = false;
            }
        }

        setInterval(loadScalesStatus, 1000);
    </script>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<header>
    <h1>Весы RADWAG WTC</h1>
    <p>Текущий вес и состояние подключения по USB-B (виртуальный COM)</p>
</header>
<main>
    <p class="refresh-note">Команда SI и данные страницы обновляются каждую секунду.</p>
    <div id="scales-status" th:insert="~{fragments/scales-status :: status}"></div>
</main>
</body>
</html>
