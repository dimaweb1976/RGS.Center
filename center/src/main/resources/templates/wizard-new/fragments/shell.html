<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<header class="wn-topbar" th:fragment="header">
    <a class="wn-brand" th:href="@{/wizard-new}" aria-label="WizardNew main menu">
        <img th:src="@{/common/assets/logo.svg}" alt="Baltic Scientific Instruments">
    </a>
    <div class="wn-topbar-title">
        <h1>RGS CENTER</h1>
        <p>Robotic Gamma-Ray Spectrometer · Control Web Interface</p>
    </div>
    <div class="wn-account">
        <div class="wn-workflow-badge" id="wn-workflow-badge" role="status"
             th:title="${wizardNewShell.workflowDetail}">
            <span class="wn-status-light" aria-hidden="true"></span>
            <span><strong th:text="${wizardNewShell.workflowState}">IDLE</strong>
                <small>Auto mode</small>
                <small th:text="${wizardNewShell.workflowDetail}">No active run</small></span>
        </div>
        <a th:unless="${authUsername != null}" th:href="@{/login}">Log in</a>
        <form th:if="${authUsername != null}" method="post" th:action="@{/auth/logout}">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">Log out</button>
        </form>
    </div>
</header>

<div class="wn-live-status" id="wn-live-status" th:fragment="liveStatus"
     th:attr="data-workflow-state=${wizardNewShell.workflowState},data-workflow-detail=${wizardNewShell.workflowDetail}"
     aria-label="Equipment status" aria-live="polite">
    <div class="wn-status-rail">
        <div class="wn-status-item" th:each="item : ${wizardNewShell.statusItems}"
             th:title="${item.detail}">
            <span class="wn-status-light" th:classappend="| is-${item.tone}|"
                  aria-hidden="true"></span>
            <span><strong th:text="${item.label}">Equipment</strong>
                <small th:text="${item.value}">No data</small></span>
        </div>
        <a class="wn-diagnostics-link" th:href="@{/wizard/devices}">View diagnostics →</a>
    </div>
    <p class="wn-status-refresh-error" id="wn-status-refresh-error" hidden>
        Status refresh failed. Last received values are shown.
    </p>
</div>

<nav class="wn-nav" th:fragment="navigation" aria-label="WizardNew sections">
    <a class="wn-nav-link" th:href="@{/wizard-new/automatic}"
       th:classappend="${activeSection == 'auto'} ? ' is-active'"
       th:attr="aria-current=${activeSection == 'auto'} ? 'page' : null">Automatic mode</a>
    <a class="wn-nav-link" th:href="@{/wizard-new/manual}"
       th:classappend="${activeSection == 'manual'} ? ' is-active'"
       th:attr="aria-current=${activeSection == 'manual'} ? 'page' : null">Manual mode</a>
    <a class="wn-nav-link" th:href="@{/wizard-new/database}"
       th:classappend="${activeSection == 'database'} ? ' is-active'"
       th:attr="aria-current=${activeSection == 'database'} ? 'page' : null">Measurement database</a>
    <span class="wn-nav-link is-pending" aria-disabled="true" title="New settings screen is not connected yet">Settings</span>
    <span class="wn-nav-link is-pending" aria-disabled="true" title="New help screen is not connected yet">Help &amp; About</span>
    <a class="wn-nav-link wn-nav-link--legacy" th:href="@{/wizard}">Open current Wizard</a>
</nav>
</body>
</html>
