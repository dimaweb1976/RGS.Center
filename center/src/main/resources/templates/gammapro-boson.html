<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RGSCenter — GammaPro_BOSON</title>
    <style>
        :root { font-family: Arial, sans-serif; color: #17202a; background: #f4f6f8; }
        * { box-sizing: border-box; }
        body { margin: 0; }
        main { max-width: 1180px; margin: 24px auto; padding: 0 20px 32px; }
        h1 { margin-bottom: 8px; }
        .refresh-note, .protocol-note { color: #596773; }
        .status-panel { transition: opacity .15s ease; }
        .status-panel.loading { opacity: .65; }
        .status-grid { width: 100%; border-collapse: collapse; background: white; }
        .status-grid th, .status-grid td { padding: 10px; border: 1px solid #ccd3d8; text-align: left; vertical-align: top; }
        .status-grid th { width: 240px; background: #eef2f5; }
        .connection-status, .boson-process-status { font-weight: bold; }
        .connection-status.CONNECTED, .boson-process-status.CONNECTED { color: #168347; }
        .connection-status.DISCONNECTED, .boson-process-status.DISCONNECTED { color: #d7192d; }
        .command-panel { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 18px; }
        .command-panel button { min-width: 180px; padding: 11px 16px; border: 1px solid #64727d; border-radius: 4px; background: white; cursor: pointer; font-weight: bold; }
        .command-panel button:hover:not(:disabled) { background: #e8eef2; }
        .command-panel button:disabled { color: #8a949c; cursor: not-allowed; background: #edf0f2; }
        .action-message { min-height: 22px; margin: 14px 0 0; color: #168347; }
        .action-message.error { color: #d7192d; }
        .raw-value { overflow-wrap: anywhere; white-space: normal; }
    </style>
    <script>
        let gammaProBosonActionPending = false;

        function gammaProBosonCsrfHeaders() {
            // auth-status.js читает актуальный raw token из XSRF-TOKEN cookie.
            // Нельзя отправлять сюда отрисованное ${_csrf.token}: для HTML оно
            // XOR-маскировано, а заголовок X-XSRF-TOKEN ожидает raw-значение.
            if (window.rgsCsrfHeaders) return window.rgsCsrfHeaders();
            const csrf = document.querySelector(".auth-csrf");
            const prefix = "XSRF-TOKEN=";
            const cookie = document.cookie.split("; ")
                .find(value => value.startsWith(prefix));
            return csrf && cookie
                ? {[csrf.dataset.header]: decodeURIComponent(
                    cookie.substring(prefix.length)
                )}
                : {};
        }

        async function gammaProBosonRequest(path, method = "GET") {
            const response = await fetch(`/gammapro-boson/${path}`, {
                method,
                cache: "no-store",
                credentials: "same-origin",
                headers: {
                    Accept: "text/html",
                    ...(method === "POST" ? gammaProBosonCsrfHeaders() : {}),
                    ...(method === "POST" && window.rgsLockHeaders
                        ? window.rgsLockHeaders()
                        : {})
                }
            });
            if (response.redirected || response.status === 401) {
                window.location.assign("/login");
                return null;
            }
            if (!response.ok) throw new Error(`HTTP ${response.status}`);
            return response.text();
        }

        async function loadGammaProBosonStatus() {
            if (gammaProBosonActionPending) return;
            const panel = document.getElementById("gammapro-boson-status");
            panel.classList.add("loading");
            try {
                const html = await gammaProBosonRequest("status");
                if (html !== null) panel.innerHTML = html;
            } catch (error) {
                console.error("Failed to update GammaPro_BOSON status", error);
            } finally {
                panel.classList.remove("loading");
            }
        }

        async function gammaProBosonAction(path) {
            if (gammaProBosonActionPending) return;
            gammaProBosonActionPending = true;
            const panel = document.getElementById("gammapro-boson-status");
            panel.classList.add("loading");
            try {
                const html = await gammaProBosonRequest(path, "POST");
                if (html !== null) panel.innerHTML = html;
            } catch (error) {
                console.error("GammaPro_BOSON command failed", error);
            } finally {
                gammaProBosonActionPending = false;
                panel.classList.remove("loading");
            }
        }

        window.setInterval(loadGammaProBosonStatus, 10000);
    </script>
</head>
<body>
<div th:replace="~{fragments/menu :: menu}"></div>
<main>
    <h1>GammaPro_BOSON</h1>
    <p class="refresh-note">Состояние автоматически обновляется каждые 10 секунд.</p>
    <div id="gammapro-boson-status" class="status-panel"
         th:insert="~{fragments/gammapro-boson-status :: status}"></div>
</main>
</body>
</html>
