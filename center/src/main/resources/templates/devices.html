<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RGSCenter — Camera</title>
    <meta http-equiv="refresh" content="10">
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #cccccc;
            text-align: left;
        }

        .ONLINE {
            color: green;
            font-weight: bold;
        }

        .OFFLINE {
            color: red;
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Camera status</h1>

<table>
    <thead>
    <tr>
        <th>Name</th>
        <th>IP address</th>
        <th>Status</th>
        <th>Last check</th>
    </tr>
    </thead>
    <tbody>
    <tr>
        <td th:text="${camera.name}">Camera</td>
        <td th:text="${camera.ipAddress}">192.168.1.13</td>
        <td th:text="${camera.status}"
            th:class="${camera.status}">
            OFFLINE
        </td>
        <td th:text="${camera.lastCheck}">-</td>
    </tr>
    </tbody>
</table>

</body>
</html>
