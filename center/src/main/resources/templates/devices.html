<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RGSCenter — Demo</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #cccccc;
            text-align: left;
        }

        .ONLINE {
            color: green;
            font-weight: bold;
        }

        .OFFLINE {
            color: red;
            font-weight: bold;
        }

        .CONNECTING {
            color: #946700;
            font-weight: bold;
        }

        .DISABLED {
            color: #777777;
            font-weight: bold;
        }

        .gamma-pro-status.CONNECTED {
            color: #168347;
            font-weight: bold;
        }

        .gamma-pro-status.DISCONNECTED {
            color: #d7192d;
            font-weight: bold;
        }

        .boson-status.CONNECTED {
            color: #168347;
            font-weight: bold;
        }

        .boson-status.DISCONNECTED {
            color: #d7192d;
            font-weight: bold;
        }

        .shp-measurements {
            margin-top: 24px;
        }

        .manipulator-state {
            margin-top: 24px;
        }

        .manipulator-state-scroll {
            overflow-x: auto;
        }

        .manipulator-state table {
            max-width: none;
            min-width: 1800px;
        }

        .manipulator-state th,
        .manipulator-state td {
            vertical-align: top;
        }

        .manipulator-status-cell {
            min-width: 150px;
        }

        .manipulator-connection-indicator,
        .manipulator-readiness-indicator {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 50%;
            vertical-align: middle;
            background-color: #777777;
        }

        .manipulator-connection-indicator.manipulator-connection--online,
        .manipulator-readiness-indicator.manipulator-status--ready {
            background-color: #24ad5f;
        }

        .manipulator-connection-indicator.manipulator-connection--offline,
        .manipulator-readiness-indicator.manipulator-status--alert {
            background-color: #ed1c2e;
        }

        .manipulator-connection-indicator.manipulator-connection--connecting,
        .manipulator-readiness-indicator.manipulator-status--busy {
            background-color: #d99800;
        }

        .manipulator-connection-text.manipulator-connection--online,
        .manipulator-readiness-text.manipulator-status--ready {
            color: #168347;
        }

        .manipulator-connection-text.manipulator-connection--offline,
        .manipulator-readiness-text.manipulator-status--alert {
            color: #d7192d;
        }

        .manipulator-connection-text.manipulator-connection--connecting,
        .manipulator-readiness-text.manipulator-status--busy {
            color: #946700;
        }

        .manipulator-connection-text.manipulator-connection--disabled,
        .manipulator-readiness-text.manipulator-status--disabled,
        .manipulator-readiness-text.manipulator-status--no-data {
            color: #777777;
        }

        .manipulator-status-details {
            display: block;
            margin-top: 6px;
            max-width: 280px;
            color: #555555;
            font-size: 0.85rem;
            white-space: normal;
        }

        .nicole-state {
            margin-top: 24px;
        }

        .nicole-state table {
            max-width: 1600px;
        }

        .nicole-state-detail {
            display: block;
            white-space: nowrap;
        }

        .gamma-pro-state {
            margin-top: 24px;
        }

        .gamma-pro-state-scroll {
            overflow-x: auto;
        }

        .gamma-pro-state table {
            max-width: none;
            min-width: 1500px;
        }

        .gamma-pro-state th,
        .gamma-pro-state td {
            vertical-align: top;
        }

        .gamma-pro-state-value {
            min-width: 180px;
            white-space: normal;
            overflow-wrap: anywhere;
        }

        .nicole-status-cell {
            white-space: nowrap;
        }

        .nicole-connection-indicator {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 50%;
            vertical-align: middle;
            background-color: #777777;
        }

        .nicole-connection-indicator.nicole-connection--online {
            background-color: #24ad5f;
        }

        .nicole-connection-indicator.nicole-connection--offline {
            background-color: #ed1c2e;
        }

        .nicole-connection-text.nicole-connection--online {
            color: #168347;
        }

        .nicole-connection-text.nicole-connection--offline {
            color: #d7192d;
        }

        .nicole-connection-text.nicole-connection--disabled {
            color: #777777;
        }

        .nicole-status-indicator {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 50%;
            vertical-align: middle;
            background-color: #777777;
        }

        .nicole-status-indicator.nicole-status--ready {
            background-color: #24ad5f;
        }

        .nicole-status-indicator.nicole-status--alert {
            background-color: #ed1c2e;
        }

        .nicole-status-text.nicole-status--ready {
            color: #168347;
        }

        .nicole-status-text.nicole-status--alert {
            color: #d7192d;
        }

        .nicole-status-text.nicole-status--disabled {
            color: #777777;
        }

        .nicole-status-text.nicole-status--no-data {
            color: #777777;
        }

        .scenario-status-cell {
            white-space: nowrap;
        }

        .scenario-status-indicator {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 50%;
            vertical-align: middle;
            background-color: #777777;
        }

        .scenario-status-indicator.scenario-status--normal {
            background-color: #24ad5f;
        }

        .scenario-status-indicator.scenario-status--emergency,
        .scenario-status-indicator.scenario-status--aborting {
            background-color: #ed1c2e;
        }

        .scenario-status-indicator.scenario-status--paused,
        .scenario-status-indicator.scenario-status--recovery-required {
            background-color: #d99800;
        }

        .scenario-status-text.scenario-status--normal {
            color: #168347;
        }

        .scenario-status-text.scenario-status--emergency,
        .scenario-status-text.scenario-status--aborting {
            color: #d7192d;
        }

        .scenario-status-text.scenario-status--paused,
        .scenario-status-text.scenario-status--recovery-required {
            color: #946700;
        }

        .shp-measurements table {
            max-width: 1400px;
        }

        .shp-status-cell {
            white-space: nowrap;
        }

        .shp-status-indicator {
            display: inline-block;
            width: 18px;
            height: 18px;
            margin-right: 8px;
            border-radius: 50%;
            vertical-align: middle;
            background-color: #777777;
        }

        .shp-status-indicator.shp-status--ready {
            background-color: #24ad5f;
        }

        .shp-status-indicator.shp-status--alert {
            background-color: #ed1c2e;
        }

        .shp-status-indicator.shp-status--no-data {
            background-color: #777777;
        }

        .shp-status-text.shp-status--ready {
            color: #168347;
        }

        .shp-status-text.shp-status--alert {
            color: #d7192d;
        }

        .shp-status-text.shp-status--no-data {
            color: #777777;
        }
    </style>
    <script>
        async function loadStatus() {
            try {
                const response = await fetch("/devices/status", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                document.getElementById("device-status").innerHTML =
                    await response.text();
            } catch (error) {
                console.error("Failed to update device status", error);
            }
        }

        setInterval(loadStatus, 10000);
    </script>
</head>
<body>

<div th:replace="~{fragments/menu :: menu}"></div>

<h1>RGSCenter devices status</h1>

<div id="device-status">
    <div th:replace="~{fragments/device-status :: status}"></div>
</div>

</body>
</html>
