<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>RGSCenter — Camera</title>
    <style>
        table {
            border-collapse: collapse;
            width: 100%;
            max-width: 900px;
        }

        th, td {
            padding: 10px;
            border: 1px solid #cccccc;
            text-align: left;
        }

        .ONLINE {
            color: green;
            font-weight: bold;
        }

        .OFFLINE {
            color: red;
            font-weight: bold;
        }
    </style>
    <script>
        async function loadStatus() {
            try {
                const response = await fetch("/devices/status", {
                    cache: "no-store"
                });

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

                document.getElementById("device-status").innerHTML =
                    await response.text();
            } catch (error) {
                console.error("Failed to update device status", error);
            }
        }

        setInterval(loadStatus, 10000);
    </script>
</head>
<body>

<h1>Camera status</h1>

<div id="device-status">
    <table th:replace="~{fragments/device-status :: status}"></table>
</div>

</body>
</html>
