<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RGSCenter — Automatic preparation</title>
    <link rel="stylesheet" th:href="@{/wizard/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/layout.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/components.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/automatic.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/workflow.css}">
    <script defer th:src="@{/wizard/js/status-refresh.js}"></script>
    <script defer th:src="@{/wizard/js/automatic-actions.js}"></script>
</head>
<body class="wizard-page">
<div class="wizard-shell">
    <div th:replace="~{wizard/fragments/header :: header}"></div>

    <main class="wizard-main wizard-main--automatic" id="wizard-main-content">
        <nav class="wizard-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/wizard}">Main menu</a>
            <span aria-hidden="true">/</span>
            <span>Automatic preparation</span>
        </nav>
        <div th:replace="~{wizard/fragments/automatic-workspace :: workspace}"></div>
    </main>

    <footer class="wizard-footer">
        <span>Automatic workflow — preparation stage</span>
        <a th:href="@{/wizard}">Cancel and return to main menu</a>
    </footer>
</div>
</body>
</html>
