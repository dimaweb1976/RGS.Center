<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|RGSCenter - ${serviceDevice.device.name}|">RGSCenter - Device</title>
    <link rel="stylesheet" th:href="@{/wizard/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/layout.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/components.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/service-devices.css}">
    <script defer th:src="@{/wizard/js/status-refresh.js}"></script>
    <script defer th:src="@{/wizard/js/service-devices.js}"></script>
</head>
<body class="wizard-page">
<div class="wizard-shell">
    <div th:replace="~{wizard/fragments/header :: header}"></div>
    <main class="wizard-main">
        <nav class="wizard-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/wizard}">Main menu</a><span>/</span>
            <a th:href="@{/wizard/devices}">Service devices</a><span>/</span>
            <span th:text="${serviceDevice.device.name}">Device</span>
        </nav>
        <div th:replace="~{wizard/fragments/service-device-detail :: serviceContent}"></div>
    </main>
    <footer class="wizard-footer">
        <span>RGSCenter Wizard - stage 11</span>
        <a th:href="@{/wizard/devices}">All devices</a>
    </footer>
</div>
</body>
</html>
