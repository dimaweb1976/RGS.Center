<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<div id="wizard-live-status" th:fragment="liveStatus">
    <div class="wizard-status-rail" aria-label="Equipment status">
        <div class="wizard-status-item"
             th:each="item : ${wizardView.statusItems}"
             th:title="${item.detail}">
            <span class="wizard-status-light"
                  th:classappend="${item.state.cssClass}"
                  aria-hidden="true"></span>
            <span class="wizard-status-copy">
                <strong th:text="${item.value}">No data</strong>
                <small th:text="${item.label}">Equipment</small>
            </span>
            <span class="wizard-visually-hidden"
                  th:text="${item.state.label}">No data</span>
        </div>
    </div>

    <section class="wizard-alert-panel"
             th:classappend="${wizardView.alerts.empty} ? ' wizard-alert-panel--ok'"
             aria-live="polite">
        <div th:if="${wizardView.alerts.empty}" class="wizard-alert-ok">
            <span class="wizard-alert-symbol" aria-hidden="true">✓</span>
            <span>No active equipment alerts</span>
        </div>
        <div th:unless="${wizardView.alerts.empty}" class="wizard-alert-content">
            <span class="wizard-alert-symbol" aria-hidden="true">!</span>
            <div>
                <strong>Equipment requires attention</strong>
                <ul>
                    <li th:each="alert : ${wizardView.alerts}"
                        th:class="${alert.cssClass}">
                        <strong th:text="${alert.deviceName}">Device</strong>
                        <span th:text="${': ' + alert.message}">: message</span>
                    </li>
                </ul>
            </div>
        </div>
    </section>
</div>
</body>
</html>
