<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<section id="wizard-service-content"
         th:fragment="serviceContent"
         class="wizard-service-content"
         data-service-refresh-url="/wizard/devices/status">
    <div class="wizard-service-toolbar">
        <div>
            <strong>Device overview</strong>
            <small th:text="|Snapshot: ${serviceOverview.generatedAt}|">Snapshot</small>
        </div>
        <span>Auto-refresh: 3 s</span>
    </div>
    <div class="wizard-device-grid">
        <a class="wizard-device-card"
           th:each="device : ${serviceOverview.devices}"
           th:classappend="${device.stateCssClass}"
           th:href="@{/wizard/devices/{code}(code=${device.code})}">
            <div class="wizard-device-card__heading">
                <span class="wizard-device-indicator" aria-hidden="true"></span>
                <div>
                    <h3 th:text="${device.name}">Device</h3>
                    <small th:text="${device.protocol}">Protocol</small>
                </div>
            </div>
            <dl>
                <div><dt>Endpoint</dt><dd th:text="${device.endpoint}">-</dd></div>
                <div><dt>Connection</dt><dd th:text="${device.connection}">-</dd></div>
                <div><dt>Technical</dt><dd th:text="${device.technical}">-</dd></div>
                <div><dt>Operation</dt><dd th:text="${device.operation}">-</dd></div>
                <div><dt>Last response</dt><dd th:text="${device.lastResponse}">-</dd></div>
            </dl>
            <p class="wizard-device-error" th:if="${device.lastError != 'No data'}"
               th:text="${device.lastError}">Error</p>
        </a>
    </div>
</section>
</body>
</html>
