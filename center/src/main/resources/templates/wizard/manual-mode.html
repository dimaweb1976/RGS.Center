<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RGSCenter — Manual mode</title>
    <link rel="stylesheet" th:href="@{/wizard/css/tokens.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/layout.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/components.css}">
    <link rel="stylesheet" th:href="@{/wizard/css/workflow.css}">
    <script defer th:src="@{/wizard/js/status-refresh.js}"></script>
    <script defer th:src="@{/wizard/js/manual-actions.js}"></script>
</head>
<body class="wizard-page">
<div class="wizard-shell">
    <div th:replace="~{wizard/fragments/header :: header}"></div>

    <main class="wizard-main wizard-workflow-page" id="wizard-main-content">
        <nav class="wizard-breadcrumb" aria-label="Breadcrumb">
            <a th:href="@{/wizard}">Main menu</a><span>/</span><span>Manual mode</span>
        </nav>

        <div th:replace="~{wizard/fragments/manual-workspace :: workspace}"></div>
    </main>
</div>
</body>
</html>
