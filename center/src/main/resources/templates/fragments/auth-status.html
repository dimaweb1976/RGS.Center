<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section class="auth-status" th:fragment="status">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
    <span class="auth-csrf" hidden
          th:attr="data-token=${_csrf.token},data-header=${_csrf.headerName}"></span>
    <div class="auth-user">
        Пользователь: <strong th:text="${authUsername}">user</strong>
        <span class="auth-login" th:text="|(${authRole})|">(role)</span>
    </div>
    <div class="auth-connection-warning" role="alert" hidden>
        Внимание: одновременно подключено браузеров: <strong class="auth-connection-count">2</strong>
    </div>
    <div class="onlyone-access">
        <span class="onlyone-state" role="status">Монопольный доступ: проверка…</span>
        <input class="onlyone-password" type="password"
               placeholder="Мастер-пароль" autocomplete="current-password"
               aria-label="Мастер-пароль монопольного доступа">
        <button class="onlyone-enter" type="button">Занять</button>
        <button class="onlyone-exit" type="button" hidden>Освободить</button>
    </div>
    <form method="post" th:action="@{/auth/logout}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit" class="auth-logout">Выйти</button>
    </form>
    <script th:src="@{/js/auth-status.js}" defer></script>
</section>
</body>
</html>
