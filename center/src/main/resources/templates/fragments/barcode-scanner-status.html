<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="status">
    <style>
        .scanner-panel { overflow-x: auto; border: 1px solid #ccd2d8; border-radius: 7px; background: white; box-shadow: 0 2px 8px rgba(20, 35, 50, .06); }
        .scanner-table { width: 100%; min-width: 980px; border-collapse: collapse; }
        .scanner-table th, .scanner-table td { padding: 13px 14px; border-bottom: 1px solid #e0e4e8; text-align: left; vertical-align: middle; }
        .scanner-table th { color: #465360; background: #f7f8f9; font-size: 13px; }
        .scanner-status { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
        .scanner-indicator { width: 14px; height: 14px; border-radius: 50%; background: #777; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .16); }
        .scanner-online, .scanner-operation-success { color: #167638; }
        .scanner-online .scanner-indicator, .scanner-operation-success .scanner-indicator { background: #1fa34a; }
        .scanner-offline, .scanner-operation-error, .scanner-operation-timeout { color: #b72222; }
        .scanner-offline .scanner-indicator, .scanner-operation-error .scanner-indicator, .scanner-operation-timeout .scanner-indicator { background: #d52d2d; }
        .scanner-operation-scanning { color: #9a6700; }
        .scanner-operation-scanning .scanner-indicator { background: #f5a623; }
        .scanner-disabled, .scanner-operation-idle, .scanner-operation-cancelled { color: #687582; }
        .scanner-details { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 14px; padding: 12px 15px; border-radius: 5px; background: #e9edf1; }
        .scanner-result { margin-top: 14px; padding: 16px; border-radius: 6px; background: #fff; border: 1px solid #ccd2d8; }
        .scanner-result code { font-size: 21px; overflow-wrap: anywhere; }
        .scanner-error { margin-top: 14px; padding: 12px 15px; border: 1px solid #dc6060; border-radius: 5px; color: #9d2020; background: #fff2f2; }
        .scanner-actions { display: flex; gap: 10px; margin-top: 18px; }
        .scanner-actions button { border: 0; border-radius: 6px; padding: 10px 16px; cursor: pointer; font-weight: 700; }
        .scanner-actions button:disabled { cursor: not-allowed; opacity: .45; }
        .scanner-read { color: white; background: #087f5b; }
        .scanner-cancel { color: #243340; background: #dce5eb; }
    </style>
    <div class="scanner-panel">
        <table class="scanner-table">
            <thead>
            <tr>
                <th>Связь</th>
                <th>Операция</th>
                <th>Попытка</th>
                <th>Последний heartbeat</th>
                <th>Последнее сканирование</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td>
                    <span class="scanner-status" th:classappend="${scanner.connectionCssClass}">
                        <span class="scanner-indicator" aria-hidden="true"></span>
                        <span th:text="${scanner.connectionLabel}">OFFLINE</span>
                    </span>
                </td>
                <td>
                    <span class="scanner-status" th:classappend="${scanner.operationCssClass}">
                        <span class="scanner-indicator" aria-hidden="true"></span>
                        <span th:text="${scanner.operationLabel}">ОЖИДАНИЕ</span>
                    </span>
                </td>
                <td th:text="${scanner.attempt}">—</td>
                <td th:text="${scanner.lastHeartbeat}">—</td>
                <td th:text="${scanner.lastScan}">—</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="scanner-details">
        <span>Порт: <strong th:text="${scanner.portName}">COM8</strong></span>
        <span>Скорость: <strong th:text="${scanner.baudRate}">9600</strong> baud</span>
        <span>Worker: <strong th:text="${scanner.workerState}">STOPPED</strong></span>
        <span>Инициализация: <strong th:text="${scanner.initialized ? 'выполнена' : 'не выполнена'}">не выполнена</strong></span>
    </div>
    <div class="scanner-result">
        Последний штрих-код: <code th:text="${scanner.lastBarcode}">—</code>
    </div>
    <div class="scanner-error" th:if="${scanner.error != '—'}">
        Ошибка: <span th:text="${scanner.error}"></span>
    </div>
    <div class="scanner-actions">
        <button type="button" class="scanner-read"
                th:disabled="${!scanner.canStart}"
                onclick="scannerAction('read')">Считать штрих-код</button>
        <button type="button" class="scanner-cancel"
                th:disabled="${!scanner.canCancel}"
                onclick="scannerAction('cancel')">Отменить</button>
    </div>
</section>
</body>
</html>
