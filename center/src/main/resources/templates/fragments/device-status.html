<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>

<table th:fragment="status">
    <thead>
    <tr>
        <th>Name</th>
        <th>IP address</th>
        <th>Status</th>
        <th>Last check</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="device : ${devices}">
        <td th:text="${device.name}">Camera</td>
        <td th:text="${device.ipAddress}">192.168.1.13</td>
        <td th:text="${device.status}"
            th:class="${device.status}">
            OFFLINE
        </td>
        <td th:text="${device.lastCheck}">-</td>
    </tr>
    </tbody>
</table>

</body>
</html>
