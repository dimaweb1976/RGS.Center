<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<body>
<section th:fragment="status">
    <style>
        .scales-panel { overflow-x: auto; border: 1px solid #ccd2d8; border-radius: 7px; background: white; box-shadow: 0 2px 8px rgba(20, 35, 50, .06); }
        .scales-table { width: 100%; min-width: 980px; border-collapse: collapse; }
        .scales-table th, .scales-table td { padding: 13px 14px; border-bottom: 1px solid #e0e4e8; text-align: left; vertical-align: middle; }
        .scales-table th { color: #465360; background: #f7f8f9; font-size: 13px; }
        .scales-table tbody tr:last-child td { border-bottom: 0; }
        .scales-status { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; }
        .scales-indicator { width: 14px; height: 14px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .16); }
        .scales-online .scales-indicator, .scales-zero .scales-indicator { background: #1fa34a; }
        .scales-offline .scales-indicator, .scales-not-zero .scales-indicator { background: #d52d2d; }
        .scales-online, .scales-zero { color: #167638; }
        .scales-offline, .scales-not-zero { color: #b72222; }
        .scales-weight { font-size: 24px; font-weight: 700; white-space: nowrap; }
        .scales-details { display: flex; flex-wrap: wrap; gap: 10px 24px; margin-top: 14px; padding: 12px 15px; border-radius: 5px; background: #e9edf1; }
        .scales-error { margin-top: 14px; padding: 12px 15px; border: 1px solid #dc6060; border-radius: 5px; color: #9d2020; background: #fff2f2; }
    </style>
    <div class="scales-panel">
        <table class="scales-table">
            <thead>
            <tr>
                <th>Время проверки</th>
                <th>Ping / связь</th>
                <th>Индикатор нуля</th>
                <th>Стабильность</th>
                <th>Вес образца</th>
                <th>Последнее измерение</th>
            </tr>
            </thead>
            <tbody>
            <tr>
                <td th:text="${scales.lastCheck}">—</td>
                <td>
                    <span class="scales-status" th:classappend="${scales.connectionCssClass}">
                        <span class="scales-indicator" aria-hidden="true"></span>
                        <span th:text="${scales.connectionLabel}">OFFLINE</span>
                    </span>
                </td>
                <td>
                    <span class="scales-status" th:classappend="${scales.zeroCssClass}">
                        <span class="scales-indicator" aria-hidden="true"></span>
                        <span th:text="${scales.zeroLabel}">НЕ НОЛЬ</span>
                    </span>
                </td>
                <td th:text="${scales.stability}">—</td>
                <td class="scales-weight"><span th:text="${scales.weightGrams}">—</span> g</td>
                <td th:text="${scales.lastMeasurement}">—</td>
            </tr>
            </tbody>
        </table>
    </div>
    <div class="scales-details">
        <span>Порт: <strong th:text="${scales.portName}">COM7</strong></span>
        <span>Скорость: <strong th:text="${scales.baudRate}">9600</strong> baud</span>
        <span>Состояние worker: <strong th:text="${scales.workerState}">STOPPED</strong></span>
    </div>
    <div class="scales-error" th:if="${scales.lastError != '—'}">
        Ошибка связи: <span th:text="${scales.lastError}"></span>
    </div>
</section>
</body>
</html>
